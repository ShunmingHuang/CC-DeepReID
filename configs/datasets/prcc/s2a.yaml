# PRCC + ResNet50, S2A_MODE = 's2a'
#
# This is the CSCI transcription: ONE shared trunk carrying a shared spatial
# scene (conv_kv, updated every block by its own unmasked self-attention) that
# both branches READ, with only the decision isolated (each branch has its own
# query/key, and neither appears in the other's read).
#
# Measured topology (scripts/compare_variants.py, layer4[0], same seed):
#   perturb branch 0 -> branch 0 out : 1.774e+00   (must move)
#   perturb branch 0 -> branch 1 out : 1.411e+00   (COUPLED -- by design)
#   params: trunk 64.01M, whole model 64.94M
#
# The coupling is the point: the scene is a shared bottleneck both branches can
# write into, which is what CSCI's S2A relies on. It also means the cloth loss
# changes F's features, so the two losses are NOT independently ablatable here.
# For the opposite trade see configs/datasets/prcc/sealed.yaml.
#
# Run:
#   python train.py --config_file configs/datasets/prcc/s2a.yaml \
#       DATASETS.ROOT_DIR /path/to/data SOLVER.IMS_PER_BATCH 64

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------
MODEL:
  DEVICE: "cuda"
  NAME: "resnet"
  LAST_STRIDE: 1
  PRETRAIN: "pretrain/resnet50-pretrained.pth"
  NECK: "bnneck"
  ID_LOSS_WEIGHT: 1.0
  TRIPLET_LOSS_WEIGHT: 1.0
  FEAT_DIM: 2048
  NO_MARGIN: False
  LABELSMOOTH: True

  # ---- dual-branch trunk ----
  DUAL_BRANCH: True
  S2A_MODE: "s2a"           # shared scene, isolated decision (CSCI's mechanism)
  S2A_BRANCHES: 2           # branch 0 = F (identity), branch 1 = F' (identity-indep.)
  S2A_BRANCH_WIDTH: 2048    # width of ONE branch; the map is B x this
  CLOTH_LOSS_WEIGHT: 1.0    # weight of the F' clothing softmax
  DISENTANGLE_WEIGHT: 1.0   # weight of the F / F' separation term
  DISENTANGLE_MARGIN: null  # null -> |cos| (CSCI); a float switches to a hinge

  # ---- clothing classification head (on F') ----
  CLOTH_HEAD: "linear"      # 'linear' | 'cosine' (C2R's NormalizedClassifier)
  CLOTH_HEAD_SCALE: 16.0    # only used when CLOTH_HEAD == 'cosine'

  # ---- colour-histogram regression on F' (CSCI profile-44 recipe) ----
  USE_HIST: False           # turn on to run the extra annotation-free target
  HIST_DIM: 32
  HIST_HIDDEN: 1024
  HIST_SIGMA: 0.001
  HIST_INTENSITY_SCALE: False
  HIST_NORM: "l1"
  HIST_NORM_P: 1
  HIST_WEIGHT_SCALE: 100.0
  HIST_LOSS: "cosine"
  HIST_LOSS_WEIGHT: 1.0

# -----------------------------------------------------------------------------
# INPUT
# -----------------------------------------------------------------------------
INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]
  PADDING: 10

# -----------------------------------------------------------------------------
# DATASETS
# -----------------------------------------------------------------------------
DATASETS:
  NAMES: "prcc"
  ROOT_DIR: "../data"       # override with DATASETS.ROOT_DIR <path>

# -----------------------------------------------------------------------------
# DATALOADER
# -----------------------------------------------------------------------------
DATALOADER:
  NUM_WORKERS: 8
  SAMPLER: "triplet"
  NUM_INSTANCE: 16          # keep IMS_PER_BATCH = num_ids_per_batch * NUM_INSTANCE

# -----------------------------------------------------------------------------
# SOLVER
# -----------------------------------------------------------------------------
SOLVER:
  OPTIMIZER_NAME: "AdamW"
  MAX_EPOCHS: 100
  BASE_LR: 0.0003
  SEED: 1234
  MOMENTUM: 0.9
  MARGIN: 0.3
  WEIGHT_DECAY: 0.0005
  WEIGHT_DECAY_BIAS: 0.0005
  WARMUP_EPOCHS: 5
  WARMUP_TYPE: "linear"
  COSINE_MARGIN: 0.5
  COSINE_SCALE: 30
  LR_SCHEDULER: "cosine"
  STEPSIZE: [40, 70]
  GAMMA: 0.1
  CHECKPOINT_PERIOD: 10
  LOG_PERIOD: 10
  EVAL_PERIOD: 10
  IMS_PER_BATCH: 64

# -----------------------------------------------------------------------------
# TEST
# -----------------------------------------------------------------------------
TEST:
  IMS_PER_BATCH: 128
  WEIGHT: ""
  NECK_FEAT: "after"
  FEAT_NORM: True
  # PRCC gallery is test/A; query_diff is test/C (clothes-changing) and
  # query_same is test/B (the standard protocol)
  MODE: "both"              # 'both' | 'cc'
  EVAL_PROTOCOL: "CC"       # which protocol selects the best checkpoint

# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------
EXP_NAME: "prcc_resnet_s2a"
LOG_DIR: "logs/prcc"
OUTPUT_DIR: "outputs/prcc"
