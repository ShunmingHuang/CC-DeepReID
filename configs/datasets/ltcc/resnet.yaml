# LTCC Dataset Configuration for ResNet
# Based on configs/default.py

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------
MODEL:
  DEVICE: "cuda"
  NAME: "resnet"
  LAST_STRIDE: 1
  PRETRAIN: "pretrain/resnet50-pretrained.pth"
  NECK: "bnneck"
  ID_LOSS_WEIGHT: 1.0
  TRIPLET_LOSS_WEIGHT: 1.0
  FEAT_DIM: 2048
  NO_MARGIN: False
  LABELSMOOTH: True
  # ---- dual-branch channel attention behind the backbone ----
  #  F  = identity branch               : ID + triplet
  #  F' = identity-independent branch   : currently supervised by the cloth
  #       softmax (+ optional CAL / colour histogram); other modules go here later
  #  F vs F'                            : pushed apart (orthogonal)
  DUAL_BRANCH: True
  ATT_REDUCTION: 16
  CLOTH_FEAT_DIM: -1        # -1 -> F' keeps 2048 dims (same width as F)
  ATT_PROJECTOR: False
  CLOTH_LOSS_WEIGHT: 1.0
  DISENTANGLE_WEIGHT: 1.0
  DISENTANGLE_MARGIN: null  # null -> |cos| (CSCI); a float switches to a hinge

  # ---- clothing classification head (on F') ----
  #  'linear' : plain dot-product head
  #  'cosine' : C2R-ReID's NormalizedClassifier (L2-normalised features AND
  #             class weights, logits = CLOTH_HEAD_SCALE * cos)
  CLOTH_HEAD: "linear"
  CLOTH_HEAD_SCALE: 16.0

  # ---- C2R-ReID clothes-based adversarial loss (CAL) ----
  #  the clothing discriminator trains on DETACHED F' with its own optimizer,
  #  starting at CAL_START_EPOCH; the backbone sees the same loss on live F'
  USE_CAL: False
  CAL_WEIGHT: 1.0
  CAL_SCALE: 16.0
  CAL_EPSILON: 0.1
  CAL_START_EPOCH: 25       # 1-based epoch at which CAL switches on
  CAL_LR: 3.5e-4

  # ---- colour-histogram regression on F' (CSCI profile-44 recipe) ----
  #  annotation-free target: RGB-uv histogram of the same augmented image.
  #  Runs ALONGSIDE the cloth softmax, which is kept.
  USE_HIST: False
  HIST_DIM: 32              # bins per axis; label/head output length = HIST_DIM**2
  HIST_HIDDEN: 1024
  HIST_SIGMA: 0.001
  HIST_INTENSITY_SCALE: False
  HIST_NORM: "l1"           # 'l1' | 'l2' | null
  HIST_NORM_P: 1
  HIST_WEIGHT_SCALE: 100.0  # CSCI's wt
  HIST_LOSS: "cosine"       # 'cosine' (1-|cos|) | 'mse' | 'l1'
  HIST_LOSS_WEIGHT: 1.0

# -----------------------------------------------------------------------------
# INPUT
# -----------------------------------------------------------------------------
INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]
  PADDING: 10

# -----------------------------------------------------------------------------
# DATASETS
# -----------------------------------------------------------------------------
DATASETS:
  NAMES: "ltcc"
  ROOT_DIR: "../data"

# -----------------------------------------------------------------------------
# DATALOADER
# -----------------------------------------------------------------------------
DATALOADER:
  NUM_WORKERS: 8
  SAMPLER: "triplet"
  NUM_INSTANCE: 16

# -----------------------------------------------------------------------------
# SOLVER
# -----------------------------------------------------------------------------
SOLVER:
  OPTIMIZER_NAME: "AdamW"
  MAX_EPOCHS: 100
  BASE_LR: 0.0003
  SEED: 1234
  MOMENTUM: 0.9
  MARGIN: 0.3
  WEIGHT_DECAY: 0.0005
  WEIGHT_DECAY_BIAS: 0.0005
  WARMUP_EPOCHS: 5
  COSINE_MARGIN: 0.5
  COSINE_SCALE: 30
  LR_SCHEDULER: "cosine"
  STEPSIZE: [40, 70]
  GAMMA: 0.1
  CHECKPOINT_PERIOD: 10
  LOG_PERIOD: 10
  EVAL_PERIOD: 10
  IMS_PER_BATCH: 64

# -----------------------------------------------------------------------------
# TEST
# -----------------------------------------------------------------------------
TEST:
  IMS_PER_BATCH: 128
  WEIGHT: ""
  NECK_FEAT: "after"
  FEAT_NORM: True
  # 'both' -> report CC (clothes-changing rule) AND General (standard rule)
  # 'cc'   -> report only the clothes-changing protocol
  MODE: "both"
  EVAL_PROTOCOL: "CC"

# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------
EXP_NAME: "ltcc_resnet"
LOG_DIR: "logs/ltcc"
OUTPUT_DIR: "outputs/ltcc"
