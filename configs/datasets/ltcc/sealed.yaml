# LTCC + ResNet50, S2A_MODE = 'sealed'
#
# Strict isolation: every convolution uses groups=B, so branch 0 cannot reach
# branch 1 on the forward path. No shared scene exists.
#
# Measured topology (scripts/compare_variants.py, layer4[0], same seed):
#   perturb branch 0 -> branch 1 out : 0.000e+00 (EXACTLY zero)
#   params: trunk 52.09M, whole model 53.02M; fwd+bwd batch 4: 4.28s on CPU
#
# Run:
#   python train.py --config_file configs/datasets/ltcc/sealed.yaml \
#       DATASETS.ROOT_DIR /path/to/data

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------
MODEL:
  DEVICE: "cuda"
  NAME: "resnet"
  LAST_STRIDE: 1
  PRETRAIN: "pretrain/resnet50-pretrained.pth"
  NECK: "bnneck"
  ID_LOSS_WEIGHT: 1.0
  TRIPLET_LOSS_WEIGHT: 1.0
  FEAT_DIM: 2048
  NO_MARGIN: False
  LABELSMOOTH: True

  # ---- dual-branch trunk ----
  DUAL_BRANCH: True
  S2A_MODE: "sealed"        # every conv groups=B: no forward path between branches
  S2A_BRANCHES: 2
  S2A_BRANCH_WIDTH: 2048
  CLOTH_LOSS_WEIGHT: 1.0
  DISENTANGLE_WEIGHT: 1.0
  DISENTANGLE_MARGIN: null

  # ---- clothing classification head (on F') ----
  CLOTH_HEAD: "linear"
  CLOTH_HEAD_SCALE: 16.0

  # ---- colour-histogram regression on F' ----
  USE_HIST: False
  HIST_DIM: 32
  HIST_HIDDEN: 1024
  HIST_SIGMA: 0.001
  HIST_INTENSITY_SCALE: False
  HIST_NORM: "l1"
  HIST_NORM_P: 1
  HIST_WEIGHT_SCALE: 100.0
  HIST_LOSS: "cosine"
  HIST_LOSS_WEIGHT: 1.0

# -----------------------------------------------------------------------------
# INPUT
# -----------------------------------------------------------------------------
INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]
  PADDING: 10

# -----------------------------------------------------------------------------
# DATASETS
# -----------------------------------------------------------------------------
DATASETS:
  NAMES: "ltcc"
  ROOT_DIR: "../data"

# -----------------------------------------------------------------------------
# DATALOADER
# -----------------------------------------------------------------------------
DATALOADER:
  NUM_WORKERS: 8
  SAMPLER: "triplet"
  NUM_INSTANCE: 8           # see ltcc/s2a.yaml

# -----------------------------------------------------------------------------
# SOLVER
# -----------------------------------------------------------------------------
SOLVER:
  OPTIMIZER_NAME: "AdamW"
  MAX_EPOCHS: 100
  BASE_LR: 0.0003
  SEED: 1234
  MOMENTUM: 0.9
  MARGIN: 0.3
  WEIGHT_DECAY: 0.0005
  WEIGHT_DECAY_BIAS: 0.0005
  WARMUP_EPOCHS: 5
  WARMUP_TYPE: "linear"
  COSINE_MARGIN: 0.5
  COSINE_SCALE: 30
  LR_SCHEDULER: "cosine"
  STEPSIZE: [40, 70]
  GAMMA: 0.1
  CHECKPOINT_PERIOD: 10
  LOG_PERIOD: 10
  EVAL_PERIOD: 10
  IMS_PER_BATCH: 32

# -----------------------------------------------------------------------------
# TEST
# -----------------------------------------------------------------------------
TEST:
  IMS_PER_BATCH: 128
  WEIGHT: ""
  NECK_FEAT: "after"
  FEAT_NORM: True
  MODE: "both"
  EVAL_PROTOCOL: "CC"

# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------
EXP_NAME: "ltcc_resnet_sealed"
LOG_DIR: "logs/ltcc"
OUTPUT_DIR: "outputs/ltcc"
